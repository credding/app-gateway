[project]
name = "app-gateway"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "Chandler Redding", email = "c@chandler.dev" }]
requires-python = ">=3.15"
dependencies = [
  "alembic>=1.20.1",
  "authlib>=1.9.5",
  "cryptography>=50.0.2",
  "fastapi[standard]>=0.162.4",
  "httpx2[http2]>=2.16.0",
  "itsdangerous>=2.2.0",
  "joserfc>=1.8.0",
  "sqlalchemy>=2.1.8",
]

[dependency-groups]
dev = ["ruff>=0.17.4", "ty>=0.0.100"]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["correctness", "suspicious", "complexity", "performance", "style", "pedantic"]
ignore = [
  "D",
  "PTH",
  "boolean-type-hint-positional-argument",
  "missing-copyright-notice",
  "redundant-open-modes",
  "too-many-arguments",
  "too-many-branches",
  "too-many-positional-arguments",
  "too-many-return-statements",
  "typing-only-first-party-import",
  "typing-only-third-party-import",
  "typing-only-standard-library-import",
]

[tool.fastapi]
entrypoint = "app_gateway.app:app"


[tool.alembic]
script_location = "%(here)s/db_migrations"
file_template = "%%(epoch)d_%%(rev)s_%%(slug)s"

[[tool.alembic.post_write_hooks]]
name = "ruff_format"
type = "module"
module = "ruff"
options = "format REVISION_SCRIPT_FILENAME"

[[tool.alembic.post_write_hooks]]
name = "ruff_check"
type = "module"
module = "ruff"
options = "check --fix REVISION_SCRIPT_FILENAME"
